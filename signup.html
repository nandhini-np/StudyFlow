<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Smart Study Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <i class="fas fa-user-plus"></i>
        <h1>Create Account</h1>
        <p>Join StudyFlow and boost your productivity</p>
      </div>
      
      <form id="signupForm" class="auth-form">
        <div class="form-group">
          <label for="signupName"><i class="fas fa-user"></i> Full Name</label>
          <input type="text" id="signupName" placeholder="Enter your full name" required>
        </div>
        
        <div class="form-group">
          <label for="signupEmail"><i class="fas fa-envelope"></i> Email</label>
          <input type="email" id="signupEmail" placeholder="Enter your email" required>
        </div>
        
        <div class="form-group">
          <label for="signupPassword"><i class="fas fa-lock"></i> Password</label>
          <input type="password" id="signupPassword" placeholder="Create a password" required minlength="6">
        </div>
        
        <div class="form-group">
          <label for="signupConfirm"><i class="fas fa-check-circle"></i> Confirm Password</label>
          <input type="password" id="signupConfirm" placeholder="Confirm your password" required>
        </div>
        
        <button type="submit" class="auth-btn">
          <i class="fas fa-user-plus"></i> Sign Up
        </button>
        
        <div id="signupError" class="error-message"></div>
      </form>
      
      <div class="auth-footer">
        <p>Already have an account? <a href="login.html">Login</a></p>
      </div>
    </div>
  </div>
  
  <div class="theme-toggle floating">
    <i class="fas fa-moon"></i>
  </div>

  <script src="script.js"></script>
</body>
</html>
